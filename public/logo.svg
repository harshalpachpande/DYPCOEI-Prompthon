<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141B34" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="50%" stop-color="#19E3B1"/>
      <stop offset="100%" stop-color="#FF4D8D"/>
    </linearGradient>

    <linearGradient id="tealViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19E3B1"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Shield Badge -->
  <polygon points="250,30 430,135 430,365 250,470 70,365 70,135" 
           fill="url(#bgGlow)" 
           stroke="url(#neonGradient)" 
           stroke-width="8" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Inner Subtle Hexagon Grid Wireframe -->
  <polygon points="250,65 395,150 395,340 250,430 105,340 105,150" 
           fill="none" 
           stroke="#7C5CFF" 
           stroke-width="2" 
           stroke-opacity="0.35" 
           stroke-dasharray="6,6"/>

  <!-- Digital Twin City Skyline (Stylized) -->
  <path d="M 140 330 
           L 140 250 
           L 175 250 
           L 175 200 
           L 205 200 
           L 205 160 
           L 235 130 
           L 265 130 
           L 295 160 
           L 295 210 
           L 325 210 
           L 325 260 
           L 360 260 
           L 360 330 Z" 
        fill="rgba(124, 92, 255, 0.18)" 
        stroke="rgba(25, 227, 177, 0.4)" 
        stroke-width="3"/>

  <!-- Glowing City Window Matrix Dots -->
  <circle cx="230" cy="180" r="3.5" fill="#19E3B1" opacity="0.8"/>
  <circle cx="250" cy="180" r="3.5" fill="#19E3B1" opacity="0.9"/>
  <circle cx="270" cy="180" r="3.5" fill="#19E3B1" opacity="0.8"/>
  <circle cx="230" cy="210" r="3.5" fill="#7C5CFF" opacity="0.8"/>
  <circle cx="250" cy="210" r="3.5" fill="#EAF0FF" opacity="1"/>
  <circle cx="270" cy="210" r="3.5" fill="#7C5CFF" opacity="0.8"/>

  <!-- Dynamic Electric Pulse Line (The "CityPulse") -->
  <path d="M 80 300 
           L 150 300 
           L 175 270 
           L 195 330 
           L 225 210 
           L 250 360 
           L 275 240 
           L 300 320 
           L 320 280 
           L 350 300 
           L 420 300" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Pulsing Live Sensor Dot -->
  <circle cx="250" cy="360" r="8" fill="#19E3B1" filter="url(#glow)"/>
  <circle cx="250" cy="360" r="14" fill="none" stroke="#19E3B1" stroke-width="2" opacity="0.6"/>
</svg>

